<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener Frontend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">🔗 URL Shortener</h1>
        
        
        <script>
            const BACKEND_URL = "https://PUT-YOUR-RENDER-LINK-HERE.onrender.com";
        </script>
        
        <form id="urlForm" class="d-flex mb-5">
            <input required placeholder="Paste long URL here..." type="url" id="fullUrlInput" class="form-control me-2">
            <button class="btn btn-success" type="submit">Shrink It!</button>
        </form>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Full URL</th>
                    <th>Short URL</th>
                    <th>Clicks</th>
                </tr>
            </thead>
            <tbody id="urlTableBody">
                
            </tbody>
        </table>
    </div>

    <script>
        
        async function loadUrls() {
            const response = await fetch(`${BACKEND_URL}/api/urls`);
            const urls = await response.json();
            
            const tableBody = document.getElementById('urlTableBody');
            tableBody.innerHTML = ''; 

            urls.forEach(url => {
                tableBody.innerHTML += `
                    <tr>
                        <td><a href="${url.full}" target="_blank">${url.full}</a></td>
                        <td><a href="${BACKEND_URL}/${url.short}" target="_blank">${BACKEND_URL}/${url.short}</a></td>
                        <td>${url.clicks}</td>
                    </tr>
                `;
            });
        }

        
        document.getElementById('urlForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const fullUrl = document.getElementById('fullUrlInput').value;
            
            await fetch(`${BACKEND_URL}/api/shortUrls`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullUrl: fullUrl })
            });

            document.getElementById('fullUrlInput').value = ''; 
            loadUrls(); 
        });

        
        loadUrls();
    </script>
</body>
</html>
