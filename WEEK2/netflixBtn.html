<!DOCTYPE html>
<html>
<head>
    <title>Netflix Button</title>
    <style>
        body {
            background-color: #141414;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .netflix-btn {
            background: red;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .netflix-btn:hover {
            background: #c90000;
        }
    </style>
</head>
<body>
    <button class="netflix-btn">Get Started</button>
</body>
</html>
